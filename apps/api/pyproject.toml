[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enermod-api"
version = "0.1.0"
description = "EnerMod Africa Hub API: the African Energy Modelling Observatory served from PostgreSQL (Supabase) or SQLite"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic[email]>=2.7",
  "python-dotenv>=1.0",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "httpx>=0.27",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "rapidfuzz>=3.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Assistant providers (imported lazily, only when a key is configured)
ai = ["anthropic>=1.0", "google-genai>=1.0", "openai>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["enermod_api*"]

[tool.setuptools.package-data]
enermod_api = ["data/*.json"]
